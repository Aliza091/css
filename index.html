<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Uni Buddy Finder</title>
  <link rel="stylesheet" href="style1.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="main-header">
    <h1 class="site-title">Uni Buddy Finder</h1>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="signin.html">logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Find Your Study Buddy</h2>
      <p>Connect with other Ulster University computing systems students who share your modules, study styles, and availability.</p>
    </section>

    <section>
      <h2>Get Started</h2>
      <form id="buddyForm">
        <fieldset>
          <legend>Student Information</legend>
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </fieldset>

        <fieldset>
          <legend>Study Preferences</legend>
          <label for="modules">Modules:</label>
          <input type="text" id="modules" name="modules" placeholder="e.g., Computing Systems" required />

          <label for="study-style">Study Style:</label>
          <select id="study-style" name="study-style" required>
            <option value="">--Select--</option>
            <option value="solo">Solo Study</option>
            <option value="group">Group Study</option>
            <option value="mixed">Mixed</option>
          </select>

          <label for="time">Preferred Time:</label>
          <input type="time" id="time" name="time" required />
        </fieldset>

        <button type="submit">Find Buddy</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Uni Buddy Finder</p>
  </footer>
</body>
</html>
