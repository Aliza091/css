<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Uni Buddy Finder</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <header class="main-header">
    <h1 class="site-title">Uni Buddy Finder</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="signin.html">logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contact Us</h1>
      <p>If you have questions or feedback about Uni Buddy Finder, please get in touch using the form below.</p>

      <form id="contactForm">
        <label for="contact-name">Name:</label>
        <input type="text" id="contact-name" name="contact-name" required />

        <label for="contact-email">Email:</label>
        <input type="email" id="contact-email" name="contact-email" required />

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Uni Buddy Finder</p>
  </footer>
</body>
</html>
